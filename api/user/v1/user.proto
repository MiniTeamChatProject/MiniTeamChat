syntax = "proto3";
package user.v1;

option go_package = "api/user/v1;v1";

import "google/api/annotations.proto";

// 用户服务
service UserService {
  // 验证JWT token
  rpc VerifyToken(VerifyTokenRequest) returns (VerifyTokenReply) {
    option (google.api.http) = {
      post: "/v1/users/verify-token"
      body: "*"
    };
  }

  // 根据ID获取用户信息
  rpc GetUser(GetUserRequest) returns (GetUserReply) {
    option (google.api.http) = {
      get: "/v1/users/{id}"
    };
  }
}

// 验证token请求
message VerifyTokenRequest {
  string token = 1;
}

// 验证token响应
message VerifyTokenReply {
  bool valid = 1;
  string user_id = 2;
  string username = 3;
  repeated string roles = 4;
}

// 获取用户请求
message GetUserRequest {
  string id = 1;
}

// 获取用户响应
message GetUserReply {
  string id = 1;
  string username = 2;
  string email = 3;
  string created_at = 4;
}
